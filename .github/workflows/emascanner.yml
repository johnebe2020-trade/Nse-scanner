name: John's Scanner Test

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NSE 500 data
        run: |
          python nse_data_downloader.py

      - name: Run John's Scanner
        run: |
          python scanner.py

      - name: Show scanner output
        run: |
          echo "Scanner completed."
          echo ""
          echo "Universe:"
          wc -l universe.csv
          echo ""
          echo "OHLCV:"
          wc -l data/sample_ohlcv.csv
          echo ""
          echo "Output files:"
          ls -lah output/

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/


  deploy:

    needs: scan

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
