name: John's Scanner Test

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * 1-5"

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python
        run: |
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run John's Scanner
        run: |
          python scanner.py

      - name: Check generated files
        run: |
          echo "Scanner output:"
          ls -la output/

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: john-scanner-dashboard
          path: output/
