name: Quality Portfolio Monitor

on:
  schedule:
    - cron: '30 10 * * 1-5'
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  circuit-breaker:
    if: github.event.schedule == '30 10 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python circuit_breaker.py

  fundamental-rescreen:
    if: github.event.schedule == '30 2 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pandas
      - run: python fundamental_screener.py
      - run: python quality_holdings.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamental_screen_all.csv fundamental_screen_quality_pass.csv portfolio_holdings.csv
          git diff --staged --quiet || git commit -m "Fundamental re-screen update"
          git pull --rebase
          git push
