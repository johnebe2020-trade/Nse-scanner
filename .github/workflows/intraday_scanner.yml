name: Intraday Volume Surge and Support Bounce Scanner

on:
  schedule:
    - cron: '0,15,30,45 3-10 * * 1-5'   # every 15 min, ~9:00 AM-4:15 PM IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run intraday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_scanner.py

      - name: Commit cache and results files back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "intraday_cache" ]; then
            git add intraday_cache/
          fi
          if ls intraday_results_*.csv 1> /dev/null 2>&1; then
            git add intraday_results_*.csv
          fi
          git diff --staged --quiet || git commit -m "Auto: intraday update $(date +'%Y-%m-%d %H:%M')"
          git push
