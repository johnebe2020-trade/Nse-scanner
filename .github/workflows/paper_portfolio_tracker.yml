name: Paper Portfolio Tracker

on:
  workflow_run:
    workflows: ["Support Bounce Scanner"]
    types:
      - completed

jobs:
  track:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_portfolio_tracker.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_portfolio.csv
          git diff --cached --quiet || git commit -m "Paper portfolio update $(date +'%Y-%m-%d %H:%M')"
          git push
