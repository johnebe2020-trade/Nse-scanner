name: 4of4 Scanner

on:
  schedule:
    - cron: "45 10 * * 1-5"   # 4:15 PM IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests numpy openpyxl

      - run: python scanner_4of4.py

      - name: Commit results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results_4of4.csv results_4of4.md
          if ! git diff --cached --quiet; then
            git commit -m "4of4 results"
            git push
          fi
