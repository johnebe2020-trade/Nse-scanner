name: Daily Stock Scan - All Strategies

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl numpy

      - name: Run Swing Scanner
        run: python swing_scanner.py

      - name: Run 5D Breakout Scanner
        run: python breakout_5day.py

      - name: Run Monthly Levels Scanner
        run: python monthly_levels.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Daily scan update $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git pull --rebase origin main
          git push

      - name: Send results to Telegram
        run: |
          for f in data/swing_shortlist.csv data/breakout5d_buy.csv data/monthlylevels_buy.csv; do
            if [ -f "$f" ]; then
              curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                   -F document=@"$f" \
                   "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
            fi
          done
