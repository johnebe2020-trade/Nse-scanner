name: Breakout Scan

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 4:00 PM IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run breakout scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakout_scanner.py

      - name: Run position monitor
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python position_monitor.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in results_breakout.csv no_data.csv positions_status.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "scan results" || echo "no changes"
          git pull --rebase
          git push
