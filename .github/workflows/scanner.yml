name: John's Scanner Test

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # DOWNLOAD NSE 500 DATA
      # ==========================================

      - name: Download NSE 500 data
        run: |
          echo ""
          echo "=========================================="
          echo "DOWNLOADING NSE 500 DATA"
          echo "=========================================="
          echo ""

          python nse_data_downloader.py


      # ==========================================
      # RUN JOHN'S LIVE SCANNER
      # ==========================================

      - name: Run John's Scanner
        run: |
          echo ""
          echo "=========================================="
          echo "RUNNING JOHN'S SCANNER"
          echo "=========================================="
          echo ""

          python scanner.py


      # ==========================================
      # ORIGINAL BACKTEST
      # ==========================================

      - name: Run John's Backtest
        run: |
          echo ""
          echo "=========================================="
          echo "RUNNING ORIGINAL BACKTEST"
          echo "=========================================="
          echo ""

          python backtest.py


      # ==========================================
      # BACKTEST V3
      # ==========================================

      - name: Run John's Backtest V3
        run: |
          echo ""
          echo "=========================================="
          echo "RUNNING JOHN'S BACKTEST V3"
          echo "=========================================="
          echo ""

          python backtest_v3.py


      # ==========================================
      # BACKTEST V4
      # ==========================================

      - name: Run John's Backtest V4
        run: |
          echo ""
          echo "=========================================="
          echo "RUNNING JOHN'S BACKTEST V4"
          echo "EXIT MODEL COMPARISON"
          echo "=========================================="
          echo ""

          python backtest_v4.py


      # ==========================================
      # SHOW UNIVERSE
      # ==========================================

      - name: Show universe information
        run: |
          echo ""
          echo "=========================================="
          echo "UNIVERSE INFORMATION"
          echo "=========================================="
          echo ""

          if [ -f universe.csv ]; then
            echo "Universe file found:"
            wc -l universe.csv
          else
            echo "WARNING: universe.csv not found"
          fi


      # ==========================================
      # SHOW OHLCV DATA
      # ==========================================

      - name: Show OHLCV information
        run: |
          echo ""
          echo "=========================================="
          echo "OHLCV DATA INFORMATION"
          echo "=========================================="
          echo ""

          if [ -f data/sample_ohlcv.csv ]; then
            echo "OHLCV file found:"
            wc -l data/sample_ohlcv.csv

            echo ""
            echo "First 5 rows:"
            head -n 5 data/sample_ohlcv.csv

            echo ""
            echo "Last 5 rows:"
            tail -n 5 data/sample_ohlcv.csv
          else
            echo "WARNING: data/sample_ohlcv.csv not found"
          fi


      # ==========================================
      # SHOW SCANNER OUTPUT
      # ==========================================

      - name: Show scanner output
        run: |
          echo ""
          echo "=========================================="
          echo "JOHN'S SCANNER OUTPUT"
          echo "=========================================="
          echo ""

          if [ -d output ]; then
            echo "Output directory:"
            ls -lah output/
          else
            echo "WARNING: output directory not found"
          fi


      # ==========================================
      # ORIGINAL BACKTEST OUTPUT
      # ==========================================

      - name: Show original backtest output
        run: |
          echo ""
          echo "=========================================="
          echo "ORIGINAL BACKTEST OUTPUT"
          echo "=========================================="
          echo ""

          if [ -f output/backtest_results.csv ]; then
            echo "Original backtest CSV:"
            wc -l output/backtest_results.csv
          else
            echo "WARNING: Original backtest CSV not found"
          fi


      # ==========================================
      # BACKTEST V3 OUTPUT
      # ==========================================

      - name: Show Backtest V3 output
        run: |
          echo ""
          echo "=========================================="
          echo "JOHN'S BACKTEST V3 OUTPUT"
          echo "=========================================="
          echo ""

          if [ -f output/backtest_v3_results.csv ]; then
            echo "Backtest V3 CSV created successfully."
            wc -l output/backtest_v3_results.csv
          else
            echo "WARNING: Backtest V3 CSV not found."
          fi

          echo ""

          if [ -f output/backtest_v3.html ]; then
            echo "Backtest V3 HTML created successfully."
          else
            echo "WARNING: Backtest V3 HTML not found."
          fi


      # ==========================================
      # BACKTEST V4 OUTPUT
      # ==========================================

      - name: Show Backtest V4 output
        run: |
          echo ""
          echo "=========================================="
          echo "JOHN'S BACKTEST V4 OUTPUT"
          echo "=========================================="
          echo ""

          if [ -f output/backtest_v4_results.csv ]; then
            echo "Backtest V4 trade CSV created successfully."

            wc -l output/backtest_v4_results.csv
          else
            echo "WARNING: backtest_v4_results.csv not found."
          fi

          echo ""

          if [ -f output/backtest_v4_summary.csv ]; then
            echo "=========================================="
            echo "BACKTEST V4 SUMMARY"
            echo "=========================================="
            echo ""

            cat output/backtest_v4_summary.csv
          else
            echo "WARNING: backtest_v4_summary.csv not found."
          fi

          echo ""

          if [ -f output/backtest_v4.html ]; then
            echo "Backtest V4 HTML created successfully."
          else
            echo "WARNING: backtest_v4.html not found."
          fi


      # ==========================================
      # LIST FINAL OUTPUT
      # ==========================================

      - name: Show final output
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL OUTPUT FILES"
          echo "=========================================="
          echo ""

          if [ -d output ]; then
            find output -maxdepth 1 -type f -printf "%f\n" | sort
          else
            echo "No output directory found."
          fi

          echo ""
          echo "=========================================="
          echo "JOHN'S SCANNER TEST FINISHED"
          echo "=========================================="


      # ==========================================
      # UPLOAD TO GITHUB PAGES
      # ==========================================

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/


  # ============================================
  # DEPLOY JOB
  # ============================================

  deploy:

    needs: scan

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
