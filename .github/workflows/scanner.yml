name: John's Scanner Test

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * 1-5"


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  # ==========================================================
  # SCAN + BACKTEST
  # ==========================================================

  scan:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # 2. SETUP PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.13"


      # ------------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ------------------------------------------------------
      # 4. DOWNLOAD NSE 500 DATA
      # ------------------------------------------------------

      - name: Download NSE 500 data
        run: |

          echo "=========================================="
          echo "DOWNLOADING NSE 500 DATA"
          echo "=========================================="

          python nse_data_downloader.py


      # ------------------------------------------------------
      # 5. RUN JOHN'S SCANNER
      # ------------------------------------------------------

      - name: Run John's Scanner
        run: |

          echo "=========================================="
          echo "RUNNING JOHN'S SCANNER"
          echo "=========================================="

          python scanner.py


      # ------------------------------------------------------
      # 6. RUN ORIGINAL BACKTEST
      # ------------------------------------------------------

      - name: Run John's Backtest
        run: |

          echo "=========================================="
          echo "RUNNING ORIGINAL BACKTEST"
          echo "=========================================="

          python backtest.py


      # ------------------------------------------------------
      # 7. RUN NEW NO STOP-LOSS BACKTEST
      # ------------------------------------------------------

      - name: Run John's No-SL Backtest
        run: |

          echo "=========================================="
          echo "RUNNING NO STOP-LOSS BACKTEST"
          echo "=========================================="

          python backtest_no_sl.py


      # ------------------------------------------------------
      # 8. SHOW ALL RESULTS
      # ------------------------------------------------------

      - name: Show scanner output
        run: |

          echo ""
          echo "=========================================="
          echo "JOHN'S SCANNER COMPLETED"
          echo "=========================================="

          echo ""
          echo "UNIVERSE"
          echo "------------------------------------------"

          if [ -f universe.csv ]; then
            wc -l universe.csv
          else
            echo "universe.csv not found"
          fi


          echo ""
          echo "OHLCV DATA"
          echo "------------------------------------------"

          if [ -f data/sample_ohlcv.csv ]; then
            wc -l data/sample_ohlcv.csv
          else
            echo "data/sample_ohlcv.csv not found"
          fi


          echo ""
          echo "OUTPUT FILES"
          echo "------------------------------------------"

          ls -lah output/


          echo ""
          echo "=========================================="
          echo "ORIGINAL BACKTEST"
          echo "=========================================="

          if [ -f output/backtest_results.csv ]; then

            echo "Original backtest CSV:"
            wc -l output/backtest_results.csv

          else

            echo "WARNING:"
            echo "Original backtest CSV not found."

          fi


          echo ""
          echo "=========================================="
          echo "NO STOP-LOSS BACKTEST"
          echo "=========================================="

          if [ -f output/backtest_no_sl_results.csv ]; then

            echo "No-SL backtest CSV:"
            wc -l output/backtest_no_sl_results.csv

          else

            echo "WARNING:"
            echo "No-SL backtest CSV not found."

          fi


          echo ""
          echo "=========================================="
          echo "NO STOP-LOSS HTML"
          echo "=========================================="

          if [ -f output/backtest_no_sl.html ]; then

            echo "No-SL dashboard created successfully."

          else

            echo "WARNING:"
            echo "No-SL dashboard not found."

          fi


          echo ""
          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          find output -maxdepth 1 -type f -printf "%f\n" | sort


      # ------------------------------------------------------
      # 9. UPLOAD OUTPUT TO GITHUB PAGES
      # ------------------------------------------------------

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v4

        with:
          path: output/


  # ==========================================================
  # DEPLOY TO GITHUB PAGES
  # ==========================================================

  deploy:

    needs: scan

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }


    steps:

      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
