name: John's Scanner Test

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # DOWNLOAD NSE 500 DATA
      # ==========================================

      - name: Download NSE 500 data
        run: |
          echo "=========================================="
          echo "DOWNLOADING NSE 500 DATA"
          echo "=========================================="

          python nse_data_downloader.py


      # ==========================================
      # RUN JOHN'S SCANNER
      # ==========================================

      - name: Run John's Scanner
        run: |
          echo "=========================================="
          echo "RUNNING JOHN'S SCANNER"
          echo "=========================================="

          python scanner.py


      # ==========================================
      # RUN ORIGINAL BACKTEST
      # ==========================================

      - name: Run John's Backtest
        run: |
          echo "=========================================="
          echo "RUNNING ORIGINAL BACKTEST"
          echo "=========================================="

          python backtest.py


      # ==========================================
      # RUN BACKTEST V3
      # ==========================================

      - name: Run John's Backtest V3
        run: |
          echo "=========================================="
          echo "RUNNING JOHN'S BACKTEST V3"
          echo "=========================================="

          python backtest_v3.py


      # ==========================================
      # SHOW SCANNER OUTPUT
      # ==========================================

      - name: Show scanner output
        run: |

          echo ""
          echo "=========================================="
          echo "JOHN'S SCANNER COMPLETED"
          echo "=========================================="

          echo ""
          echo "UNIVERSE"
          echo "------------------------------------------"

          if [ -f universe.csv ]; then
            wc -l universe.csv
          else
            echo "universe.csv not found"
          fi


          echo ""
          echo "OHLCV DATA"
          echo "------------------------------------------"

          if [ -f data/sample_ohlcv.csv ]; then
            wc -l data/sample_ohlcv.csv
          else
            echo "data/sample_ohlcv.csv not found"
          fi


          echo ""
          echo "OUTPUT FILES"
          echo "------------------------------------------"

          ls -lah output/


      # ==========================================
      # SHOW ORIGINAL BACKTEST
      # ==========================================

      - name: Show original backtest output
        run: |

          echo ""
          echo "=========================================="
          echo "ORIGINAL BACKTEST"
          echo "=========================================="

          if [ -f output/backtest_results.csv ]; then
            echo "Original backtest CSV:"
            wc -l output/backtest_results.csv
          else
            echo "WARNING:"
            echo "Original backtest CSV not found."
          fi


      # ==========================================
      # SHOW BACKTEST V3
      # ==========================================

      - name: Show Backtest V3 output
        run: |

          echo ""
          echo "=========================================="
          echo "JOHN'S BACKTEST V3 OUTPUT"
          echo "=========================================="

          if [ -f output/backtest_v3_results.csv ]; then
            echo ""
            echo "Backtest V3 CSV created successfully."
            wc -l output/backtest_v3_results.csv
          else
            echo ""
            echo "WARNING:"
            echo "Backtest V3 CSV not found."
          fi


          if [ -f output/backtest_v3.html ]; then
            echo ""
            echo "Backtest V3 HTML created successfully."
          else
            echo ""
            echo "WARNING:"
            echo "Backtest V3 HTML not found."
          fi


      # ==========================================
      # DISPLAY FINAL BACKTEST FILES
      # ==========================================

      - name: Show final output
        run: |

          echo ""
          echo "=========================================="
          echo "FINAL OUTPUT FILES"
          echo "=========================================="

          find output -maxdepth 1 -type f -printf "%f\n" | sort

          echo ""
          echo "=========================================="
          echo "JOHN'S SCANNER TEST FINISHED"
          echo "=========================================="


      # ==========================================
      # UPLOAD TO GITHUB PAGES
      # ==========================================

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/


  # ==========================================
  # DEPLOY TO GITHUB PAGES
  # ==========================================

  deploy:

    needs: scan

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
