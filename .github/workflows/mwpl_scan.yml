name: MWPL Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pandas

      - name: Run MWPL scan
        run: python mwpl_scan.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in mwpl_results.csv mwpl_all.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "mwpl results" || echo "no changes"
          git pull --rebase
          git push
