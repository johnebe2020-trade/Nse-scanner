name: Subprice Momentum Scanner

on:
  schedule:
    # Daily after market close - 4:00 PM IST (10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas beautifulsoup4
      - run: python subprice_momentum_scanner.py
      - run: | git config --global user.name "github-actions[bot]" git config --global user.email "github-actions[bot]@users.noreply.github.com" git add subprice_momentum_portfolio.csv subprice_momentum_log.csv subprice_momentum_ranking.csv git diff --staged --quiet || git commit -m "Subprice momentum daily update" git pull --rebase git push
