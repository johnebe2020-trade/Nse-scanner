<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE Scanner - Master Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 12px;
    font-size: 14px;
  }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 0; }
  .refresh-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .refresh-bar button {
    background: var(--blue); color: #000; border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; font-size: 13px;
  }
  #lastUpdated { color: var(--muted); font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .pill.pos { background: rgba(63,185,80,0.15); color: var(--green); }
  .pill.neg { background: rgba(248,81,73,0.15); color: var(--red); }
  .pill.neutral { background: rgba(139,148,158,0.15); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  .table-scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }
  .pos-val { color: var(--green); }
  .neg-val { color: var(--red); }
  .status-hold { color: var(--blue); }
  .status-hit { color: var(--green); }
  .status-sl { color: var(--red); }
  .loading { color: var(--muted); font-style: italic; padding: 10px 0; }
  .error { color: var(--red); font-size: 12px; padding: 8px 0; }
  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-bottom: 8px;
  }
  .stat-box {
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;
  }
  .stat-label { color: var(--muted); font-size: 11px; }
  .stat-value { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .config-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 16px;
  }
  .config-box input {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
    background: #0d1117; color: var(--text); font-size: 13px; margin-top: 6px;
  }
  .config-box label { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<h1>📊 NSE Scanner - Master Dashboard</h1>

<div class="config-box">
  <label>GitHub repo (owner/repo) - change if needed, then tap Refresh</label>
  <input id="repoInput" value="johnebe2020-trade/Nse-scanner" />
</div>

<div class="refresh-bar">
  <button onclick="loadAll()">🔄 Refresh All</button>
  <span id="lastUpdated">Not loaded yet</span>
</div>

<div id="dashboard">
  <!-- Cards get injected here -->
</div>

<script>
const SOURCES = [
  { title: "Quality Buy & Hold Portfolio", path: "portfolio_holdings.csv", type: "holdings" },
  { title: "Breakout 5-Day - Portfolio Summary", path: "data/breakout5d_portfolio_summary.csv", type: "summary" },
  { title: "Breakout 5-Day - Open Positions", path: "data/breakout5d_paper_log.csv", type: "log", tail: 15 },
  { title: "Momentum Rotation - Portfolio Summary", path: "data/momentum_portfolio_log.csv", type: "summary" },
  { title: "Swing - Portfolio Summary", path: "data/swing_portfolio_summary.csv", type: "summary" },
  { title: "Deep Paper Portfolio (Pending Entries)", path: "deep_paper_portfolio.csv", type: "holdings" },
  { title: "Subprice Momentum - Current Holdings", path: "subprice_momentum_portfolio.csv", type: "holdings" },
  { title: "Subprice Momentum - Daily Log", path: "subprice_momentum_log.csv", type: "summary" },
  { title: "Fundamental Quality Screen (Pass List)", path: "fundamental_screen_quality_pass.csv", type: "raw", tail: 20 },
  { title: "Multibagger Candidates", path: "multibagger_candidates.csv", type: "raw", tail: 20 },
];

function parseCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.length > 0);
  if (lines.length === 0) return { headers: [], rows: [] };
  const headers = lines[0].split(",").map(h => h.trim());
  const rows = lines.slice(1).map(line => {
    // naive CSV split (fine for our numeric/simple-string data)
    return line.split(",").map(v => v.trim());
  });
  return { headers, rows };
}

function colorizeCell(header, value) {
  const h = header.toLowerCase();
  const num = parseFloat(value);
  if ((h.includes("pnl") || h.includes("roc") || h.includes("return")) && !isNaN(num)) {
    const cls = num > 0 ? "pos-val" : (num < 0 ? "neg-val" : "");
    return `<span class="${cls}">${value}</span>`;
  }
  if (h === "status") {
    const v = value.toUpperCase();
    if (v.includes("HOLD")) return `<span class="status-hold">${value}</span>`;
    if (v.includes("HIT") || v.includes("TARGET")) return `<span class="status-hit">${value}</span>`;
    if (v.includes("SL")) return `<span class="status-sl">${value}</span>`;
  }
  return value;
}

function buildTable(headers, rows) {
  let html = '<div class="table-scroll"><table><thead><tr>';
  headers.forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    row.forEach((cell, i) => {
      html += `<td>${colorizeCell(headers[i] || "", cell)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function summaryPill(headers, rows) {
  // Look for a PnL%/OverallPnL% type column in the last row for a quick pill
  if (rows.length === 0) return "";
  const lastRow = rows[rows.length - 1];
  const pnlIdx = headers.findIndex(h =>
    h.toLowerCase().includes("pnl") || h.toLowerCase().includes("return"));
  if (pnlIdx === -1) return "";
  const val = parseFloat(lastRow[pnlIdx]);
  if (isNaN(val)) return "";
  const cls = val > 0 ? "pos" : (val < 0 ? "neg" : "neutral");
  const sign = val > 0 ? "+" : "";
  return `<span class="pill ${cls}">${sign}${val}%</span>`;
}

async function loadSource(repo, source) {
  const url = `https://raw.githubusercontent.com/${repo}/main/${source.path}?t=${Date.now()}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const { headers, rows } = parseCSV(text);
    const displayRows = source.tail ? rows.slice(-source.tail) : rows;
    return { ok: true, headers, rows: displayRows, allRows: rows };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

async function loadAll() {
  const repo = document.getElementById("repoInput").value.trim();
  const dashboard = document.getElementById("dashboard");
  dashboard.innerHTML = SOURCES.map((s, i) =>
    `<div class="card" id="card-${i}"><div class="card-header"><h2>${s.title}</h2></div><div class="loading">Loading...</div></div>`
  ).join("");

  for (let i = 0; i < SOURCES.length; i++) {
    const source = SOURCES[i];
    const result = await loadSource(repo, source);
    const card = document.getElementById(`card-${i}`);
    if (!result.ok) {
      card.innerHTML = `<div class="card-header"><h2>${source.title}</h2></div><div class="error">Could not load (${result.error}). File may not exist yet.</div>`;
      continue;
    }
    if (result.rows.length === 0) {
      card.innerHTML = `<div class="card-header"><h2>${source.title}</h2></div><div class="loading">No data rows yet.</div>`;
      continue;
    }
    const pill = summaryPill(result.headers, result.allRows);
    card.innerHTML = `
      <div class="card-header">
        <h2>${source.title}</h2>
        ${pill}
      </div>
      ${buildTable(result.headers, result.rows)}
    `;
  }

  document.getElementById("lastUpdated").innerText =
    "Last updated: " + new Date().toLocaleString("en-IN", { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
}

// Auto-load on page open
loadAll();
</script>

</body>
</html>
